type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[29,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
