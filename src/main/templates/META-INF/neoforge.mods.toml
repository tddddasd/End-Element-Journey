modLoader = "javafml"
loaderVersion = "[3,)"
minecraftVersion = "${minecraft_version}"
neoVersion = "${neo_version}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://space.bilibili.com/1446970336"
